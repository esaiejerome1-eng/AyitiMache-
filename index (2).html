function apply(){
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
  $("bfr").className=lang==="fr"?"on":"";$("bht").className=lang==="ht"?"on":"";
  $("hb").textContent=user?"👤 "+esc((user.displayName||"").split(" ")[0]).slice(0,10):t("login");
  drawNav();drawCats();drawCities();drawList();drawFor();drawSpace();drawMsgs();drawAdmin();show();
}
window.go=v=>{if(v==="admin"&&!isAdmin())v="home";view=v;navKey={home:"home",messages:"messages",space:"profile",admin:"profile"}[v]||"home";show();scrollTo(0,0)};
function show(){
  if(view==="admin"&&!isAdmin())view="home";
  ["home","space","msgs","admin"].forEach(s=>$(s).style.display=(s===view||(s==="msgs"&&view==="messages"))?"block":"none");
  $("msgs").style.display=view==="messages"?"block":"none";
  drawNav();
}
const ICO={
home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>',
explore:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',
publish:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
messages:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
profile:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'};
let navKey="home";
function drawNav(){
  const it=[["home","home"],["explore","nav_explore"],["publish","publish"],["messages","messages"],["profile","nav_profile"]];
  $("nav").innerHTML=it.map(([k,l])=>k==="publish"
    ?`<button class="pub ${navKey===k?"on":""}" onclick="navTo('${k}')"><span class="circ">${ICO[k]}</span>${t(l)}</button>`
    :`<button class="${navKey===k?"on":""}" onclick="navTo('${k}')">${ICO[k]}${t(l)}</button>`).join("");
}
window.navTo=k=>{
  if(k==="home")go("home");
  else if(k==="explore"){go("home");setTimeout(scrollList,60)}
  else if(k==="publish"){go("space");if(!user)alert(t("need_login"));else setTimeout(()=>{const e=$("pubp");if(e)e.scrollIntoView({behavior:"smooth"})},60)}
  else if(k==="messages")go("messages");
  else go("space");
  navKey=k;drawNav();
};
function drawCats(){
  $("cats").innerHTML=["all",...CATS].map(c=>`<button class="cat ${cat===c?"on":""}" onclick="setCat('${c}')"><span>${ICON[c]}</span>${t(c)}</button>`).join("");
}
function drawList(){
  const l=ads.filter(a=>(cat==="all"||a.cat===cat)&&(cityF==="all"||a.city===cityF)&&(!q||(a.titre+" "+a.desc).toLowerCase().includes(q))).sort((a,b)=>(interests.includes(a.cat)?0:1)-(interests.includes(b.cat)?0:1));
  $("list").innerHTML=l.map(a=>{
    const mine=user&&a.ownerUid===user.uid;
    return `<div class="card" onclick="openDet('${a.id}')"><div class="im">${a.photo?`<img src="${a.photo}" alt="">`:`<div class="ph">${ICON[a.cat]||"🛍️"}</div>`}${mine?"":`<button class="hrt" aria-label="${t("fav")}" onclick="event.stopPropagation();toggleFav('${a.id}')">${heart(a.id)}</button>`}</div><div class="b"><h3>${esc(a.titre)}</h3><div class="pr">${esc(a.prix)} HTG</div><div class="mut">${t(a.cat)} · ${t("by")} ${esc(a.ownerName)}</div>${a.city?`<div class="mut">📍 ${cityName(a.city)}</div>`:""}${a.delivery?`<span class="dl">🚚 ${t("deliv")}</span>`:""}</div></div>`;
  }).join("")||`<p class="mut">${t("none")}</p>`;
}

/* ---- Compte ---- */
function drawSpace(){
  let h="";
  if(!ready)h+=`<div class="panel warn">${t("no_fb")}</div>`;
  if(!user)h+=`<div class="panel"><h2>${t("account")}</h2><input id="nom" placeholder="${t("name_ph")}"><input id="em" type="email" placeholder="${t("email_ph")}"><input id="pw" type="password" placeholder="${t("pass_ph")}"><button class="btn" onclick="signup()">${t("signup")}</button> <button class="btn navy" onclick="login()">${t("login")}</button><div class="mut" style="text-align:center;margin:12px 0">${t("or")}</div><button class="btn" style="width:100%;background:#fff;color:var(--navy);border:2px solid var(--line)" onclick="google()"><b style="color:#4285f4">G</b> ${t("google")}</button></div>`;
  else{
    h+=`<div class="panel row"><span>👤 <b>${esc(user.displayName)}</b><br><span class="mut">${esc(user.email)}</span></span><button class="btn red" onclick="logout()">${t("logout")}</button></div>`;
    if(isAdmin())h+=`<div class="panel row"><span>📊 ${t("admin")}</span><button class="btn navy" onclick="go('admin')">${t("admin")}</button></div>`;
    if(!user.emailVerified)h+=`<div class="panel warn">${t("verify")}<br><br><button class="btn navy" onclick="resend()">${t("resend")}</button></div>`;
    h+=`<div class="panel"><h2>${t("dash_t")}</h2><div id="dash"></div></div><div class="panel"><h2>❤️ ${t("favs_t")}</h2><div id="favl"></div></div><div class="panel row"><span>⭐ ${t("int_edit")}</span><button class="btn navy" onclick="openInt()">${t("edit")}</button></div><div class="panel" id="pubp"><h2>${t("pub_t")}</h2><input id="ti" placeholder="${t("title_ph")}"><input id="pr" type="number" placeholder="${t("price_ph")}"><select id="ca">${CATS.map(c=>`<option value="${c}">${t(c)}</option>`).join("")}</select><select id="ci"><option value="">${t("city_ph")}</option>${cityOpts()}</select><textarea id="de" rows="3" placeholder="${t("desc_ph")}"></textarea><label class="chk"><input type="checkbox" id="dv"> 🚚 ${t("deliv_q")}</label><input id="ph" type="file" accept="image/*" onchange="pickPhoto(this)"><button class="btn" onclick="publish()">${t("publish")}</button></div><div class="panel"><h2>${t("mine")}</h2><div id="mine"></div></div>`;
  }
  $("space").innerHTML=h;drawMine();drawDash();drawFavs();
}
function drawMine(){
  const e=$("mine");if(!e||!user)return;
  e.innerHTML=ads.filter(a=>a.ownerUid===user.uid).map(a=>`<div class="row"><span>${esc(a.titre)}<br><span class="pr">${esc(a.prix)} HTG</span></span><button class="btn red" onclick="delAd('${a.id}')">${t("del")}</button></div>`).join("")||`<p class="mut">${t("none")}</p>`;
}
const fail=e=>alert(t(ERR[e.code]||"e_gen"));
window.signup=async()=>{
  if(!ready)return alert(t("no_fb"));
  const n=$("nom").value.trim(),e=$("em").value.trim(),p=$("pw").value;if(!n)return alert(t("e_name"));
  try{const c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:n});
    await setDoc(doc(db,"users",c.user.uid),{name:n,email:e,createdAt:serverTimestamp()});await sendEmailVerification(c.user);
    user=auth.currentUser;subscribe();apply()}catch(x){fail(x)}
};
window.login=async()=>{if(!ready)return alert(t("no_fb"));try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch(x){fail(x)}};
window.google=async()=>{
  if(!ready)return alert(t("no_fb"));
  try{const r=await signInWithPopup(auth,new GoogleAuthProvider());
    if(getAdditionalUserInfo(r)?.isNewUser)await setDoc(doc(db,"users",r.user.uid),{name:r.user.displayName||"",email:r.user.email,createdAt:serverTimestamp()})}
  catch(x){if(!["auth/popup-closed-by-user","auth/cancelled-popup-request"].includes(x.code))fail(x)}
};
window.logout=async()=>{await signOut(auth);view="home"};
window.resend=async()=>{try{await sendEmailVerification(user);alert(t("sent"))}catch(x){alert(t("e_gen"))}};
window.pickPhoto=inp=>{const f=inp.files[0];if(!f)return;const i=new Image();
  i.onload=()=>{const r=Math.min(1,500/i.width),c=document.createElement("canvas");c.width=i.width*r;c.height=i.height*r;c.getContext("2d").drawImage(i,0,0,c.width,c.height);photo=c.toDataURL("image/jpeg",.6)};i.src=URL.createObjectURL(f)};
window.publish=async()=>{
  const titre=$("ti").value.trim(),prix=Number($("pr").value);if(!titre||!prix)return alert(t("need_f"));const ci=$("ci").value;if(!ci)return alert(t("need_city"));
  try{const r=await addDoc(collection(db,"annonces"),{titre,prix,city:ci,delivery:$("dv").checked,cat:$("ca").value,desc:$("de").value,photo,ownerUid:user.uid,ownerName:user.displayName||"",createdAt:serverTimestamp()});
    await setDoc(doc(db,"stats",r.id),{ownerUid:user.uid,views:0,favs:0});["ti","pr","de","ph"].forEach(i=>$(i).value="");$("dv").checked=false;$("ci").value="";photo="";go("home")}catch(x){alert(t("e_gen"))}
};
window.delAd=async id=>{
  if(!confirm(t("confirm")))return;
  try{for(const m of msgs.filter(m=>m.aid===id)){if(isAdmin())await deleteDoc(doc(db,"msgs",m.id))}await deleteDoc(doc(db,"stats",id)).catch(()=>{});await deleteDoc(doc(db,"annonces",id))}catch(e){alert(t("e_gen"))}
};

/* ---- Messagerie ---- */
const mask=s=>s.replace(/(\+?\d[\s.\-]?){8,}/g,t("h_num")).replace(/\S+@\S+\.\S+/g,t("h_mail"));
const adOf=id=>ads.find(a=>a.id===id);
const other=(aid,buyerUid)=>user.uid===buyerUid?(adOf(aid)?.ownerName||"?"):(msgs.find(m=>m.aid===aid&&m.buyerUid===buyerUid)?.buyerName||"?");
window.openChat=(aid,buyerUid)=>{
  if(!user){alert(t("need_login"));return go("space")}
  const a=adOf(aid);if(!a)return;
  cur={aid,sellerUid:a.ownerUid,buyerUid:buyerUid||user.uid};
  $("ct").textContent=a.titre+" · "+other(aid,cur.buyerUid);$("chat").style.display="flex";drawChat();
};
function drawChat(){
  if(!cur)return;
  const l=msgs.filter(m=>m.aid===cur.aid&&m.buyerUid===cur.buyerUid);
  $("cm").innerHTML=l.map(m=>`<div class="m ${m.fromUid===user.uid?"me":""}">${esc(m.text)}</div>`).join("")||`<p class="mut">${t("first")}</p>`;
  $("cm").scrollTop=1e7;
}
window.sendMsg=async()=>{
  const x=mask($("cx").value.trim());if(!x||!cur)return;
  const bn=cur.buyerUid===user.uid?(user.displayName||""):(msgs.find(m=>m.aid===cur.aid&&m.buyerUid===cur.buyerUid)?.buyerName||"");
  try{await addDoc(collection(db,"msgs"),{aid:cur.aid,buyerUid:cur.buyerUid,buyerName:bn,sellerUid:cur.sellerUid,fromUid:user.uid,fromName:user.displayName||"",text:x,createdAt:serverTimestamp()});$("cx").value=""}catch(e){alert(t("e_gen"))}
};
window.closeChat=()=>{$("chat").style.display="none";cur=null};
function drawMsgs(){
  if(!user){$("msgs").innerHTML=`<div class="panel">${t("need_login")}<br><br><button class="btn" onclick="go('space')">${t("login")}</button></div>`;return}
  const g=new Map();msgs.forEach(m=>g.set(m.aid+"|"+m.buyerUid,m));
  const l=[...g.values()].sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));
  $("msgs").innerHTML=`<div class="sec"><h2>${t("messages")}</h2>`+(l.map(m=>`<button class="conv" onclick="openChat('${m.aid}','${m.buyerUid}')"><b>${esc(adOf(m.aid)?.titre||t("deleted"))}</b> · ${esc(other(m.aid,m.buyerUid))}<small>${esc(m.text)}</small></button>`).join("")||`<p class="mut">${t("no_conv")}</p>`)+`</div>`;
}

/* ---- Admin ---- */
function drawAdmin(){
  if(!isAdmin()){$("admin").innerHTML="";return}
  const convs=new Set(msgs.map(m=>m.aid+"|"+m.buyerUid)).size,total=ads.reduce((s,a)=>s+(Number(a.prix)||0),0);
  const nw=allUsers.filter(u=>ms(u.createdAt)>Date.now()-7*864e5).length;
  const cnt={};CATS.forEach(k=>cnt[k]=ads.filter(a=>a.cat===k).length);const max=Math.max(1,...Object.values(cnt));
  const sel={};ads.forEach(a=>sel[a.ownerName]=(sel[a.ownerName]||0)+1);
  const topS=Object.entries(sel).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topA=ads.map(a=>({a,n:msgs.filter(m=>m.aid===a.id).length})).filter(x=>x.n).sort((x,y)=>y.n-x.n).slice(0,5);
  const none=`<p class="mut">${t("nothing")}</p>`;
  $("admin").innerHTML=`<div class="sec"><div class="eb">ADMIN</div><h2>📊 ${t("admin")}</h2>
  <div class="stats"><div class="stat s1"><b>${allUsers.length}</b>${t("users")}</div><div class="stat s2"><b>${ads.length}</b>${t("ads")}</div><div class="stat s3"><b>${msgs.length}</b>${t("msgn")}</div><div class="stat s4"><b>${convs}</b>${t("convs")}</div><div class="stat s5"><b>${nw}</b>${t("new7")}</div><div class="stat s6"><b>${total.toLocaleString("fr-FR")}</b>${t("value")}</div></div></div>
  <div class="panel"><h2>${t("by_cat")}</h2>${CATS.map(k=>`<div class="row" style="border:0;padding:0"><span>${ICON[k]} ${t(k)}</span><b>${cnt[k]}</b></div><div class="bar" style="width:${Math.round(cnt[k]/max*100)}%;background:${COL[k]}"></div>`).join("")}</div>
  <div class="panel"><h2>${t("sellers")}</h2>${topS.map(([n,c])=>`<div class="row"><span>👤 ${esc(n)}</span><b>${c}</b></div>`).join("")||none}</div>
  <div class="panel"><h2>${t("contacted")}</h2>${topA.map(x=>`<div class="row"><span>${esc(x.a.titre)}</span><b>${x.n}</b></div>`).join("")||none}</div>
  <div class="panel"><h2>${t("moderate")}</h2>${ads.map(a=>`<div class="row"><span>${esc(a.titre)}<br><span class="mut">${esc(a.ownerName)}</span></span><button class="btn red" onclick="delAd('${a.id}')">${t("del")}</button></div>`).join("")||none}</div>`;
}
/* ---- Centres d'intérêt + carrousel ---- */
let sel=new Set(),lastSig="",paused=0;
window.openInt=()=>{if($("int").style.display==="flex")return;sel=new Set(interests);drawInt();$("int").style.display="flex"};
function drawInt(){
  $("it").textContent=t("int_t");$("is").textContent=t("int_sub");$("ib").textContent=t("int_save");$("il").textContent=t("int_skip");
  $("ig").innerHTML=CATS.map(c=>`<button class="cat ${sel.has(c)?"on":""}" onclick="togInt('${c}')"><span>${ICON[c]}</span>${t(c)}</button>`).join("");
}
window.togInt=c=>{sel.has(c)?sel.delete(c):sel.add(c);drawInt()};
async function storeInt(a){try{await setDoc(doc(db,"users",user.uid),{interests:a},{merge:true});$("int").style.display="none"}catch(e){alert(t("e_gen"))}}
window.saveInt=()=>storeInt([...sel]);
window.skipInt=()=>storeInt(interests);
function drawFor(){
  const sec=$("forsec"),car=$("car");
  const l=user&&interests.length?ads.filter(a=>interests.includes(a.cat)&&a.ownerUid!==user.uid).slice(0,10):[];
  if(!l.length){sec.style.display="none";lastSig="";return}
  sec.style.display="block";
  const sig=lang+l.map(a=>a.id).join();if(sig===lastSig)return;lastSig=sig;
  car.innerHTML=l.map(a=>`<div class="rc" onclick="openDet('${a.id}')">${a.photo?`<img src="${a.photo}" alt="">`:`<div class="ph">${ICON[a.cat]||"🛍️"}</div>`}<div class="rb"><h3>${esc(a.titre)}</h3><div class="pr">${esc(a.prix)} HTG</div><div class="mut">${a.city?"📍 "+cityName(a.city)+" · ":""}${t(a.cat)}</div>${a.delivery?`<span class="dl">🚚 ${t("deliv")}</span>`:""}</div></div>`).join("");
  car.scrollLeft=0;
}
$("car").addEventListener("pointerdown",()=>paused=Date.now()+6000);
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)setInterval(()=>{
  const car=$("car");
  if(view!=="home"||document.hidden||Date.now()<paused||car.children.length<2)return;
  const w=car.children[0].offsetWidth+12,end=car.scrollLeft+car.clientWidth>=car.scrollWidth-4;
  car.scrollTo({left:end?0:(Math.round(car.scrollLeft/w)+1)*w,behavior:"smooth"});
},3000);
/* ---- Favoris, détail, tableau de bord ---- */
let detId=null;
const heart=id=>favs.includes(id)?"❤️":"🤍";
window.toggleFav=async id=>{
  if(!user){alert(t("need_login"));return go("space")}
  const has=favs.includes(id);
  try{await setDoc(doc(db,"users",user.uid),{favs:has?arrayRemove(id):arrayUnion(id)},{merge:true});
    updateDoc(doc(db,"stats",id),{favs:increment(has?-1:1)}).catch(()=>{})}catch(e){alert(t("e_gen"))}
};
window.openDet=id=>{
  const a=adOf(id);if(!a)return;detId=id;const k="v_"+id;
  if(!(user&&a.ownerUid===user.uid)&&!sessionStorage.getItem(k)){sessionStorage.setItem(k,"1");updateDoc(doc(db,"stats",id),{views:increment(1)}).catch(()=>{})}
  $("det").style.display="flex";drawDet();$("det").scrollTop=0;
};
window.closeDet=()=>{$("det").style.display="none";detId=null};
window.contact=id=>{closeDet();openChat(id)};
function drawDet(){
  if(!detId)return;
  const a=adOf(detId);if(!a){closeDet();return}
  const mine=user&&a.ownerUid===user.uid;
  $("dt").textContent=a.titre;
  $("db2").innerHTML=`${a.photo?`<img class="dimg" src="${a.photo}" alt="">`:`<div class="ph" style="aspect-ratio:16/9">${ICON[a.cat]||"🛍️"}</div>`}<div class="dbody"><h2 style="margin:0;font-size:22px">${esc(a.titre)}</h2><div class="pr">${esc(a.prix)} HTG</div><div><span class="tag">${t(a.cat)}</span> ${a.delivery?`<span class="dl">🚚 ${t("deliv")}</span>`:""}</div><div class="mut">${a.city?"📍 "+cityName(a.city)+" · ":""}${t("by")} ${esc(a.ownerName)}</div><p style="margin:0;line-height:1.6">${esc(a.desc)}</p>${mine?`<p class="mut">${t("your_ad")}</p>`:`<div class="dact"><button class="btn navy" onclick="toggleFav('${a.id}')">${heart(a.id)} ${t("fav")}</button><button class="btn" onclick="contact('${a.id}')">💬 ${t("contact")}</button></div>`}</div>`;
}
function drawFavs(){
  const e=$("favl");if(!e)return;
  e.innerHTML=ads.filter(a=>favs.includes(a.id)).map(a=>`<div class="row" onclick="openDet('${a.id}')" style="cursor:pointer"><span>${esc(a.titre)}<br><span class="pr">${esc(a.prix)} HTG</span></span><span>❤️</span></div>`).join("")||`<p class="mut">${t("no_favs")}</p>`;
}
function drawDash(){
  const e=$("dash");if(!e||!user)return;
  const my=ads.filter(a=>a.ownerUid===user.uid),sv=a=>statsMap[a.id]||{};
  const cv=a=>new Set(msgs.filter(m=>m.aid===a.id).map(m=>m.buyerUid)).size;
  const sum=f=>my.reduce((n,a)=>n+f(a),0);
  e.innerHTML=`<div class="stats"><div class="stat s1"><b>${sum(a=>sv(a).views||0)}</b>${t("views")}</div><div class="stat s5"><b>${sum(a=>sv(a).favs||0)}</b>${t("favs_n")}</div><div class="stat s3"><b>${sum(cv)}</b>${t("contacts")}</div><div class="stat s2"><b>${my.length}</b>${t("ads")}</div></div>`+(my.map(a=>`<div class="row"><span>${esc(a.titre)}${a.delivery?" 🚚":""}</span><span class="mut">👁 ${sv(a).views||0} · ❤️ ${sv(a).favs||0} · 💬 ${cv(a)}</span></div>`).join("")||`<p class="mut">${t("none")}</p>`);
}
function drawCities(){$("cf").innerHTML=`<option value="all">${t("all_cities")}</option>`+cityOpts();$("cf").value=cityF}
window.setCity=v=>{cityF=v;drawList()};
apply();
</script>
</body>
</html>
